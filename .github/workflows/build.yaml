name: "build"
on:
    push:
        branches:
            - "sylius-2"
        paths-ignore:
            - "**/*.md"
    pull_request:
        paths-ignore:
            - "**/*.md"
    workflow_dispatch: ~

jobs:
    tests:
        name: "Sylius ${{ matrix.sylius }}, PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }}, MySQL ${{ matrix.mysql }}"

        runs-on: "ubuntu-latest"

        strategy:
            fail-fast: false
            matrix:
                php: ["8.4"]
                symfony: ["^7.4"]
                sylius: ["~2.2.0"]
                node: ["22.x"]
                mysql: ["8.4"]

        env:
            APP_ENV: "test"
            BEHAT_BASE_URL: "https://127.0.0.1:8080/"
            BEHAT_CHROME_URL: "http://127.0.0.1:9222"
            DATABASE_URL: "mysql://root:root@127.0.0.1/sylius?serverVersion=${{ matrix.mysql }}"
            PHP_EXTENSIONS: "intl, mbstring"

        steps:
            -   name: "Checkout"
                uses: "actions/checkout@v4"

            -   name: "Setup PHP, with composer and extensions"
                uses: "shivammathur/setup-php@v2"
                with:
                    php-version: "${{ matrix.php }}"
                    extensions: "${{ env.PHP_EXTENSIONS }}"
                    tools: "flex,symfony"
                    coverage: "none"

            -   name: "Setup Node"
                uses: "actions/setup-node@v4"
                with:
                    node-version: "${{ matrix.node }}"

            -   name: "Shutdown default MySQL"
                run: "sudo service mysql stop"

            -   name: "Setup MySQL"
                uses: "mirromutth/mysql-action@v1.1"
                with:
                    mysql version: "${{ matrix.mysql }}"
                    mysql root password: "root"

            -   name: "Output PHP version for Symfony CLI"
                run: "php -v | head -n 1 | awk '{ print $2 }' > .php-version"

            -   name: "Validate composer"
                run: "composer validate --ansi --strict"

            -   name: "Get Composer cache directory"
                id: "composer-cache"
                run: "echo \"dir=$(composer config cache-files-dir)\" >> $GITHUB_OUTPUT"

            -   name: "Cache Composer"
                uses: "actions/cache@v4"
                with:
                    path: "${{ steps.composer-cache.outputs.dir }}"
                    key: "${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('**/composer.json **/composer.lock') }}"
                    restore-keys: |
                        ${{ runner.os }}-php-${{ matrix.php }}-composer-

            -   name: "Restrict Symfony version"
                if: "matrix.symfony != ''"
                run: |
                    composer global require --no-progress --no-scripts --no-plugins "symfony/flex:^2.4"
                    composer global config --no-plugins allow-plugins.symfony/flex true
                    composer config extra.symfony.require "${{ matrix.symfony }}"

            -   name: "Restrict Sylius version"
                if: "matrix.sylius != ''"
                run: "composer require \"sylius/sylius:${{ matrix.sylius }}\" --no-update --no-scripts --no-interaction"

            -   name: "Install composer dependencies"
                run: "composer install --no-interaction"

            -   name: "Lint container"
                run: "vendor/bin/console lint:container"

            -   name: "Lint yaml files"
                run: "vendor/bin/console lint:yaml config"

            -   name: "Lint twig files"
                run: "vendor/bin/console lint:twig templates"

            -   name: "Check style"
                run: "composer check-style"

            -   name: "Static analysis"
                run: "vendor/bin/psalm --no-cache"

            -   name: "Run phpspec"
                run: "vendor/bin/phpspec run --ansi -f progress --no-interaction"

            -   name: "Run phpunit"
                run: "composer phpunit"

            -   name: "Get Yarn cache directory"
                id: "yarn-cache"
                run: "echo \"dir=$(yarn cache dir)\" >> $GITHUB_OUTPUT"

            -   name: "Cache Yarn"
                uses: "actions/cache@v4"
                with:
                    path: "${{ steps.yarn-cache.outputs.dir }}"
                    key: "${{ runner.os }}-node-${{ matrix.node }}-yarn-${{ hashFiles('**/package.json **/yarn.lock') }}"
                    restore-keys: |
                        ${{ runner.os }}-node-${{ matrix.node }}-yarn-

            -   name: "Install JS dependencies"
                run: "(cd vendor/sylius/test-application && yarn install)"

            -   name: "Create database"
                run: "vendor/bin/console doctrine:database:create -vvv"

            -   name: "Create database schema"
                run: "vendor/bin/console doctrine:schema:create -vvv"

            -   name: "Validate Doctrine mapping"
                run: "vendor/bin/console doctrine:schema:validate"

            -   name: "Install assets"
                run: "vendor/bin/console assets:install vendor/sylius/test-application/public -vvv"

            -   name: "Build assets"
                run: "(cd vendor/sylius/test-application && yarn build)"

            -   name: "Warm up cache"
                run: "vendor/bin/console cache:warmup -vvv"

            -   name: "Install certificates"
                run: "symfony server:ca:install || true"

            -   name: "Run Chrome Headless"
                run: "google-chrome-stable --enable-automation --disable-background-networking --no-default-browser-check --no-first-run --disable-popup-blocking --disable-default-apps --allow-insecure-localhost --disable-translate --disable-extensions --no-sandbox --enable-features=Metal --headless --remote-debugging-port=9222 --window-size=2880,1800 --proxy-server='direct://' --proxy-bypass-list='*' http://127.0.0.1 > /dev/null 2>&1 &"

            -   name: "Wait for Chrome to start"
                run: |
                    until curl -s http://127.0.0.1:9222/json/version | grep "Browser" > /dev/null 2>&1
                    do
                        sleep 1
                    done

            -   name: "Run webserver"
                run: "symfony server:start --port=8080 --daemon"

            -   name: "Run behat"
                run: "vendor/bin/behat --colors --strict -vvv --no-interaction || vendor/bin/behat --colors --strict -vvv --no-interaction --rerun"

            -   name: "Upload Behat logs"
                uses: "actions/upload-artifact@v4"
                if: "failure()"
                with:
                    name: "Behat logs - ${{ matrix.sylius }}-${{ github.run_id }}-${{ github.run_number }}"
                    path: "etc/build/"
                    if-no-files-found: "ignore"
                    compression-level: 6
                    overwrite: true
