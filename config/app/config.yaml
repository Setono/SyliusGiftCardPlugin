imports:
    - { resource: "@SetonoSyliusGiftCardPlugin/config/grids.yaml" }
    - { resource: "@SetonoSyliusGiftCardPlugin/config/sylius_ui.yaml" }

sylius_mailer:
    emails:
        gift_card_customer:
            subject: setono_sylius_gift_card.email.new_gift_card
            template: "@SetonoSyliusGiftCardPlugin/Email/giftCardToCustomer.html.twig"
        gift_card_order:
            subject: setono_sylius_gift_card.email.your_gift_cards_you_bought_in_the_order
            template: "@SetonoSyliusGiftCardPlugin/Email/giftCardsFromOrder.html.twig"

liip_imagine:
    filter_sets:
        setono_sylius_gift_card_background:
            filters:
                thumbnail: { size: [1200], mode: inset }

# TODO the admin CRUD javascripts (image preview, live PDF rendering, send-customer-email
# checkbox) and the shop account gift card index hooks used the removed sylius_ui "events"
# block system (SonataBlock-style). They still need to be ported to sylius/twig-hooks.
