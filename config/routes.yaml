setono_sylius_gift_card_shop:
    resource: "@SetonoSyliusGiftCardPlugin/config/routes/shop.yaml"
    prefix: /{_locale}
    requirements:
        _locale: ^[A-Za-z]{2,4}(_([A-Za-z]{4}|[0-9]{3}))?(_([A-Za-z]{2}|[0-9]{3}))?$

setono_sylius_gift_card_admin:
    resource: "@SetonoSyliusGiftCardPlugin/config/routes/admin.yaml"
    prefix: /admin

setono_sylius_gift_card_admin_ajax:
    resource: "@SetonoSyliusGiftCardPlugin/config/routes/admin_ajax.yaml"
    prefix: /admin/ajax
