setono_sylius_gift_card_admin_gift_card:
    resource: |
        alias: setono_sylius_gift_card.gift_card
        section: admin
        permission: true
        # No bulk delete: a card may only be deleted while nothing has happened to it, and Sylius' bulk delete stops at
        # the first card it may not delete, after deleting the ones before it
        only: [index, create, update, delete]
        templates: '@SyliusAdmin\\Crud'
        redirect: index
        grid: setono_sylius_gift_card_admin_gift_card
        vars:
            all:
                subheader: setono_sylius_gift_card.ui.manage_gift_cards
                templates:
                    form: "@SetonoSyliusGiftCardPlugin/admin/gift_card/_form.html.twig"
            index:
                icon: 'gift'
    type: sylius.resource

setono_sylius_gift_card_admin_gift_card_balance:
    path: /gift-cards/balance
    methods: [GET]
    defaults:
        _controller: Setono\SyliusGiftCardPlugin\Controller\Action\Admin\GiftCardBalanceAction
        _sylius:
            section: admin
            permission: true

setono_sylius_gift_card_admin_gift_card_show:
    path: /gift-cards/{id}
    methods: [GET]
    requirements:
        id: \d+
    defaults:
        _controller: setono_sylius_gift_card.controller.gift_card::showAction
        _sylius:
            section: admin
            permission: true
            template: '@SetonoSyliusGiftCardPlugin/admin/gift_card/show.html.twig'

setono_sylius_gift_card_admin_create_gift_card_product:
    path: /gift-cards/create-product
    methods: [POST]
    defaults:
        _controller: Setono\SyliusGiftCardPlugin\Controller\Action\Admin\CreateGiftCardProductAction
        _sylius:
            section: admin
            permission: true

# Pressed from the setup warning while the gift card payment method is missing
setono_sylius_gift_card_admin_create_gift_card_payment_method:
    path: /gift-cards/create-payment-method
    methods: [POST]
    defaults:
        _controller: Setono\SyliusGiftCardPlugin\Controller\Action\Admin\CreateGiftCardPaymentMethodAction
        _sylius:
            section: admin
            permission: true

setono_sylius_gift_card_admin_gift_card_pdf:
    path: /gift-cards/{id}/pdf
    methods: [GET]
    requirements:
        id: \d+
    defaults:
        _controller: Setono\SyliusGiftCardPlugin\Controller\Action\DownloadGiftCardPdfAction
        _sylius:
            section: admin
            permission: true

setono_sylius_gift_card_admin_gift_card_send_email:
    path: /gift-cards/{id}/send-email
    methods: [POST]
    requirements:
        id: \d+
    defaults:
        _controller: Setono\SyliusGiftCardPlugin\Controller\Action\Admin\SendGiftCardEmailAction
        _sylius:
            section: admin
            permission: true

setono_sylius_gift_card_admin_gift_card_adjust_balance:
    path: /gift-cards/{id}/adjust-balance
    methods: [GET, POST]
    requirements:
        id: \d+
    defaults:
        _controller: Setono\SyliusGiftCardPlugin\Controller\Action\Admin\AdjustGiftCardBalanceAction
        _sylius:
            section: admin
            permission: true

setono_sylius_gift_card_admin_gift_card_design:
    resource: |
        alias: setono_sylius_gift_card.gift_card_design
        section: admin
        permission: true
        # A design has no show page, and Sylius' admin ships no show template to render one with. Its grid offers no
        # bulk action either, so there is no bulk delete for one to post to
        only: [index, create, update, delete]
        templates: '@SyliusAdmin\\Crud'
        redirect: index
        grid: setono_sylius_gift_card_admin_gift_card_design
        vars:
            all:
                subheader: setono_sylius_gift_card.ui.manage_gift_card_designs
                templates:
                    form: "@SetonoSyliusGiftCardPlugin/admin/gift_card_design/_form.html.twig"
            index:
                icon: 'palette'
    type: sylius.resource

setono_sylius_gift_card_admin_gift_card_design_preview_pdf:
    path: /gift-card-designs/{id}/preview-pdf
    methods: [GET]
    requirements:
        id: \d+
    defaults:
        _controller: Setono\SyliusGiftCardPlugin\Controller\Action\Admin\PreviewGiftCardDesignPdfAction
        _sylius:
            section: admin
            permission: true
