setono_sylius_gift_card_shop_add_gift_card_to_order:
    path: /gift-cards
    methods: [POST]
    defaults:
        _controller: Setono\SyliusGiftCardPlugin\Controller\Action\AddGiftCardToOrderAction

setono_sylius_gift_card_shop_remove_gift_card_from_order:
    path: /gift-cards/{giftCard}/remove
    methods: [POST]
    defaults:
        _controller: Setono\SyliusGiftCardPlugin\Controller\Action\RemoveGiftCardFromOrderAction
