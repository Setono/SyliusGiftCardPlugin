sylius_grid:
    grids:
        setono_sylius_gift_card_admin_gift_card:
            driver:
                name: doctrine/orm
                options:
                    class: "%setono_sylius_gift_card.model.gift_card.class%"
                    repository:
                        method: createListQueryBuilder
            limits: [100, 200, 500, 1000]
            sorting:
                createdAt: desc
            fields:
                code:
                    type: string
                    label: sylius.ui.code
                    sortable: ~
                customer:
                    type: twig
                    label: sylius.ui.customer
                    options:
                        template: "@SetonoSyliusGiftCardPlugin/Admin/GiftCard/Grid/Field/customer.html.twig"
                amount:
                    type: twig
                    label: sylius.ui.amount
                    path: .
                    options:
                        template: "@SetonoSyliusGiftCardPlugin/Admin/GiftCard/Grid/Field/amount.html.twig"
                deliveryType:
                    type: twig
                    label: setono_sylius_gift_card.ui.delivery_type
                    path: .
                    sortable: ~
                    options:
                        template: "@SetonoSyliusGiftCardPlugin/Admin/GiftCard/Grid/Field/deliveryType.html.twig"
                enabled:
                    type: twig
                    label: sylius.ui.enabled
                    options:
                        template: "@SyliusUi/Grid/Field/enabled.html.twig"
                    sortable: ~
                createdAt:
                    type: datetime
                    label: sylius.ui.created_at
                    sortable: ~
                    options:
                        format: 'Y-m-d H:i'
            filters:
                code:
                    type: string
                    label: sylius.ui.code
                enabled:
                    type: boolean
                    label: sylius.ui.enabled
            actions:
                main:
                    create:
                        type: create
                    create_product:
                        type: default
                        label: setono_sylius_gift_card.ui.create_gift_card_product
                        options:
                            link:
                                route: setono_sylius_gift_card_admin_create_gift_card_product
                        icon: shopping bag
                item:
                    show:
                        type: show
                        options:
                            link:
                                route: setono_sylius_gift_card_admin_gift_card_show
                                parameters:
                                    id: resource.id
                    update:
                        type: update
                    download_pdf:
                        type: default
                        label: setono_sylius_gift_card.ui.download_pdf
                        options:
                            link:
                                route: setono_sylius_gift_card_admin_gift_card_pdf
                                parameters:
                                    id: resource.id
                        icon: download
                    adjust_balance:
                        type: default
                        label: setono_sylius_gift_card.ui.adjust_balance
                        options:
                            link:
                                route: setono_sylius_gift_card_admin_gift_card_adjust_balance
                                parameters:
                                    id: resource.id
                        icon: balance scale
                    delete:
                        type: delete

        setono_sylius_gift_card_admin_gift_card_design:
            driver:
                name: doctrine/orm
                options:
                    class: "%setono_sylius_gift_card.model.gift_card_design.class%"
            sorting:
                position: asc
            fields:
                image:
                    type: twig
                    label: setono_sylius_gift_card.ui.image
                    path: .
                    options:
                        template: "@SetonoSyliusGiftCardPlugin/Admin/GiftCardDesign/Grid/Field/image.html.twig"
                code:
                    type: string
                    label: sylius.ui.code
                    sortable: ~
                name:
                    type: string
                    label: sylius.ui.name
                    path: translation.name
                position:
                    type: string
                    label: setono_sylius_gift_card.ui.position
                    sortable: ~
                enabled:
                    type: twig
                    label: sylius.ui.enabled
                    options:
                        template: "@SyliusUi/Grid/Field/enabled.html.twig"
                    sortable: ~
            actions:
                main:
                    create:
                        type: create
                item:
                    update:
                        type: update
                    delete:
                        type: delete
