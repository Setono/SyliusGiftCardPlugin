sylius_grid:
    grids:
        setono_sylius_gift_card_admin_gift_card_design:
            driver:
                name: doctrine/orm
                options:
                    class: "%setono_sylius_gift_card.model.gift_card_design.class%"
            sorting:
                position: asc
            fields:
                image:
                    type: twig
                    label: setono_sylius_gift_card.ui.image
                    options:
                        template: "@SetonoSyliusGiftCardPlugin/Admin/GiftCardDesign/Grid/Field/image.html.twig"
                code:
                    type: string
                    label: sylius.ui.code
                    sortable: ~
                name:
                    type: string
                    label: sylius.ui.name
                    path: translation.name
                position:
                    type: string
                    label: setono_sylius_gift_card.ui.position
                    sortable: ~
                enabled:
                    type: twig
                    label: sylius.ui.enabled
                    options:
                        template: "@SyliusUi/Grid/Field/enabled.html.twig"
                    sortable: ~
            actions:
                main:
                    create:
                        type: create
                item:
                    update:
                        type: update
                    delete:
                        type: delete
