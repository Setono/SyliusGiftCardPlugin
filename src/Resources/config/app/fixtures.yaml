sylius_fixtures:
    suites:
        default:
            fixtures:
                setono_gift_card_design:
                    options:
                        custom:
                            classic:
                                code: classic
                                name: Classic
                                enabled: true
                                position: 0
                                # a design with artwork on both sides, so the demo shows - and the test suite
                                # covers - the back the customer gets when the merchant uploads one
                                back_image: '@SetonoSyliusGiftCardPlugin/Resources/fixtures/default_background.png'

                setono_gift_card_product:
                    options:
                        custom:
                            gift_card:
                                code: gift_card
                                name: Gift card
                                price: 5000
                                # delivery_types is left out, which gives a variant for each delivery type. Spelled out
                                # here, a suite importing this one could only add to it; left out, such a suite can set
                                # delivery_types: [virtual] (or [physical]) to seed the product with that variant only

                setono_gift_card:
                    options:
                        # virtual cards; an entry with delivery_type: physical seeds a physical one
                        random: 20

                # the payment method gift card payments are made with, as setono:gift-card:create-payment-method
                # creates it, so the seeded shop takes gift cards
                setono_gift_card_payment_method: ~
