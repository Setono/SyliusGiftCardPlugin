setono_sylius_gift_card:
    add_gift_card_to_order_command:
        gift_card:
            not_blank: Please enter a gift card code
    adjust_gift_card_balance_command:
        amount:
            not_blank: Please enter an amount
            not_zero: 'Enter an amount other than 0: a positive amount increases the balance, a negative amount decreases it.'
        reason:
            not_blank: Please enter a reason for the adjustment
    gift_card:
        custom_message:
            too_long: 'The message may be at most {{ limit }} characters long.'
        code:
            not_blank: Please enter code
            unique: Code must be unique
            too_short: 'The code must have at least {{ limit }} letters and digits, so it cannot be guessed.'
        amount:
            not_blank: Please enter amount
            integer: Amount must be an integer
            greater_than_or_equal: The amount must be greater than or equal to 1
            too_large: The amount is more than a gift card can hold.
        currency_code:
            not_blank: Please choose a currency
            invalid: This is not a valid currency
            not_base_currency: 'The currency {{ currency }} is not the base currency of the channel {{ channel }} ({{ base_currency }}). Gift card balances are kept in the channel''s base currency, so a card can only be issued in it.'
        design:
            not_available_in_channel: 'The design {{ design }} is not available in the channel {{ channel }}. Choose one of the channel''s designs, or none.'
        send_notification_email:
            boolean: Send notification email must be a boolean
        could_not_be_applied: The gift card could not be applied to your order.
        already_applied: This gift card is already applied to your order.
        adjustment_makes_balance_negative: 'Deducting more than the gift card holds is not possible. The balance is {{ balance }}.'
        adjustment_makes_balance_too_large: 'A gift card cannot hold more than {{ maximum }}. The balance is {{ balance }}.'
    gift_card_information:
        amount:
            too_low: 'The gift card amount must be at least {{ minimum }}.'
            too_high: 'The gift card amount may not be more than {{ maximum }}.'
            too_large: The gift card amount is more than a gift card can hold.
        design:
            required: 'Please choose a design.'
    gift_card_design:
        code:
            not_blank: Please enter a code
            unique: Another design already uses this code
        position:
            not_null: Please enter a position
            out_of_range: 'The position must be between {{ min }} and {{ max }}.'
        name:
            not_blank: Please enter a name
        images:
            unique_type: You can only add one "{{ type }}" image to a design.
