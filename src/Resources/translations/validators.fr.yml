        amount:
            too_low: 'Le montant du chèque-cadeau doit être au moins de {{ minimum }}.'
            too_high: 'Le montant du chèque-cadeau ne peut pas dépasser {{ maximum }}.'
        design:
            required: 'Veuillez choisir un modèle.'
    gift_card_design:
        code:
            not_blank: Veuillez renseigner un code
            unique: Ce code est déjà utilisé par un autre modèle
        position:
            not_null: Veuillez saisir une position
        name:
            not_blank: Veuillez renseigner un nom
        images:
            unique_type: 'Vous ne pouvez ajouter qu''une seule image "{{ type }}" à un modèle.'
