parameters:
    # Adds a fallback DATABASE_URL if the env var is not set.
    # This allows you to run cache:warmup even if your
    # environment variables are not available yet.
    # You should not need to change this value.
    env(DATABASE_URL): ''

doctrine:
    dbal:
        driver: 'pdo_mysql'
        server_version: '5.7'
        charset: UTF8

        url: '%env(resolve:DATABASE_URL)%'

    orm:
        auto_generate_proxy_classes: '%kernel.debug%'
        auto_mapping: true
        # No naming strategy, exactly like Sylius-Standard: the plugin names every column explicitly, so the physical
        # schema must not depend on the application picking a strategy. Leave this out so CI notices if it starts to.
        mappings:
            App:
                is_bundle: false
                type: attribute
                dir: '%kernel.project_dir%/Model'
                prefix: 'Setono\SyliusGiftCardPlugin\Tests\Application\Model'
                alias: App
