parameters:
    # Adds a fallback DATABASE_URL if the env var is not set.
    # This allows you to run cache:warmup even if your
    # environment variables are not available yet.
    # You should not need to change this value.
    env(DATABASE_URL): ''

doctrine:
    dbal:
        driver: 'pdo_mysql'
        server_version: '5.7'
        charset: UTF8

        url: '%env(resolve:DATABASE_URL)%'

    orm:
        auto_generate_proxy_classes: '%kernel.debug%'
        auto_mapping: true
        # Sylius names its own columns explicitly, so this only affects mappings that leave the column name
        # implicit — the plugin's, here. Picking a strategy is the application's call, and this is the one a
        # Sylius application would normally use, so the test app exercises the plugin the way a real one does.
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        mappings:
            App:
                is_bundle: false
                type: annotation
                dir: '%kernel.project_dir%/Model'
                prefix: 'Setono\SyliusGiftCardPlugin\Tests\Application\Model'
                alias: App
