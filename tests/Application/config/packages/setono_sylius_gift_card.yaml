imports:
    - { resource: "@SetonoSyliusGiftCardPlugin/Resources/config/app/fixtures.yaml" }

framework:
    rate_limiter:
        limiters:
            # The end to end suite applies gift cards from a single address, so the plugin's defaults of 10 per
            # minute per session and 50 per minute per address would throttle the suite itself (and any re-run
            # within the window) rather than a guesser. The throttling itself is covered by
            # tests/Unit/Controller/Action/AddGiftCardToOrderActionTest.php
            setono_sylius_gift_card_apply:
                limit: 100
            setono_sylius_gift_card_apply_ip:
                limit: 500

sylius_fixtures:
    suites:
        default:
            fixtures:
                setono_gift_card:
                    options:
                        custom:
                            # A card with a known code and a balance large enough to cover a whole order, so the
                            # end to end redemption specs have something to apply without scraping the admin
                            e2e:
                                code: E2EREDEMPTION01
                                amount: 1000
                                enabled: true
                            # Cards that exist but cannot be used, so the specs can check that the shop answers
                            # exactly as it does for a code that does not exist at all
                            e2e_disabled:
                                code: E2EDISABLED0001
                                amount: 1000
                                enabled: false
                            e2e_spent:
                                code: E2ENOBALANCE01
                                amount: 0
                                enabled: true
