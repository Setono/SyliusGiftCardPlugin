imports:
    - { resource: "@SetonoSyliusGiftCardPlugin/Resources/config/app/fixtures.yaml" }

framework:
    rate_limiter:
        limiters:
            # The end to end suite applies gift cards from a single address, so the plugin's defaults of 10 per
            # minute per session and 50 per minute per address would throttle the suite itself (and any re-run
            # within the window) rather than a guesser. The throttling itself is covered by
            # tests/Unit/Controller/Action/AddGiftCardToOrderActionTest.php
            setono_sylius_gift_card_apply:
                limit: 100
            setono_sylius_gift_card_apply_ip:
                limit: 500

sylius_fixtures:
    suites:
        default:
            fixtures:
                setono_gift_card_product:
                    options:
                        custom:
                            # A gift card product sold as virtual cards only, which is a simple product without a
                            # variant choice. The home page lists it next to the gift_card product the shop specs
                            # buy, so they pick the gift card product offering a choice of delivery types rather
                            # than the first one they meet (discoverProducts() in specs/support/shop.js). Its code
                            # sorts after gift_card, which productIdsByKind() in specs/support/fixtures.js keeps
                            # taking as the gift card product from the products grid
                            e2e_virtual_only:
                                code: virtual_gift_card
                                name: Virtual gift card
                                delivery_types: [virtual]

                setono_gift_card:
                    options:
                        custom:
                            # A card with a known code and a balance large enough to cover a whole order, so the
                            # end to end redemption specs have something to apply without scraping the admin
                            e2e:
                                code: E2EREDEMPTION01
                                amount: 1000
                                enabled: true
                            # Cards that exist but cannot be used, so the specs can check that the shop answers
                            # exactly as it does for a code that does not exist at all
                            e2e_disabled:
                                code: E2EDISABLED0001
                                amount: 1000
                                enabled: false
                            e2e_spent:
                                code: E2ENOBALANCE01
                                amount: 0
                                enabled: true
                            # Every other seeded card is virtual, so the specs have a physical card to look at
                            # without buying one first
                            e2e_physical:
                                code: E2EPHYSICAL001
                                amount: 50
                                enabled: true
                                delivery_type: physical
