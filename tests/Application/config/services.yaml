# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices/configuration.html#application-related-configuration
parameters:
    locale: en_US

services:
    # The end to end suite's channel shows its prices in euros as well as dollars (#488), and Sylius has no fixture for
    # the exchange rate that takes
    Setono\SyliusGiftCardPlugin\Tests\Application\Fixture\ExchangeRateFixture:
        arguments: ['@sylius.factory.exchange_rate', '@sylius.manager.exchange_rate', '@sylius.repository.currency']
        tags: ['sylius_fixtures.fixture']
