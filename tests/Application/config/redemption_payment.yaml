# Switches the test application to the "payment" redemption mode.
#
# The mode cannot be an environment variable: the plugin's extension uses it to decide which service file to
# load, so it is fixed when the container is compiled. Running the end to end specs in payment mode therefore
# means building a second container with this file in place:
#
#   cp config/redemption_payment.yaml config/packages/zz_redemption_payment.yaml
#   bin/console cache:clear && symfony server:stop && symfony serve --no-tls -d --port=8080
#   (cd ../Playwright && REDEMPTION_MODE=payment npx playwright test)
#   rm config/packages/zz_redemption_payment.yaml && bin/console cache:clear
#
# It lives outside config/packages so it is never loaded by accident; the copy is gitignored.
setono_sylius_gift_card:
    redemption:
        mode: payment
